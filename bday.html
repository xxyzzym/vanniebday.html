<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fdf6ff; --soft:#e4cdfa;
  --env:#8a5bd6; --env-d:#6d3fb8; --flap:#a27be6; --paper:#fff8ff; --text:#3b1d63;
  box-sizing:border-box; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:"Quicksand",system-ui,sans-serif;
  background:
    radial-gradient(circle at 20% 15%,rgba(185,140,242,.35),transparent 45%),
    radial-gradient(circle at 85% 80%,rgba(214,120,230,.25),transparent 50%),
    linear-gradient(170deg,#2a0f4f 0%,#4a1d86 55%,#1a0933 100%);
  background-color:#2a0f4f;
}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
.flash{position:fixed;inset:0;z-index:11;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0%,rgba(230,190,255,.8) 30%,transparent 70%)}
.flash.go{animation:flash .8s ease-out}
@keyframes flash{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(1.8)}}
#garden{position:fixed;left:0;right:0;bottom:0;height:70%;pointer-events:none;z-index:1}
.stem{position:absolute;bottom:0;width:4px;height:0;margin-left:-2px;background:linear-gradient(#7fd1ae,#3f8f76);border-radius:4px;animation:grow 1.2s cubic-bezier(.2,.8,.3,1) forwards}
.fl{position:absolute;width:var(--s);height:var(--s);margin:0 0 0 calc(var(--s)/-2);transform:scale(0) rotate(-120deg);animation:bloom 1.3s cubic-bezier(.2,1.5,.4,1) forwards;filter:drop-shadow(0 0 10px rgba(255,200,255,.5))}
@keyframes grow{to{height:var(--h)}}
@keyframes bloom{to{transform:scale(1) rotate(0)}}
.scene{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px;text-align:center;transition:opacity .9s,transform .9s}
.scene.off{opacity:0;transform:translateY(40px) scale(.92);pointer-events:none}
h1{font:600 clamp(28px,7.5vw,48px)/1.12 "Fraunces",Georgia,serif;margin:0;letter-spacing:-.01em;text-shadow:0 0 30px rgba(185,140,242,.7)}
.sub{margin:8px 0 0;color:var(--soft);font-size:17px}
.btn{font:600 18px "Quicksand",system-ui,sans-serif;cursor:pointer;border:0;border-radius:999px;padding:16px 34px;color:#2a0f4f;background:linear-gradient(135deg,#f6d9ff,#c9a2ff);box-shadow:0 0 0 0 rgba(201,162,255,.7),0 10px 30px rgba(10,0,30,.5);animation:pulse 2s infinite;transition:transform .15s,opacity .4s}
.btn:hover{transform:scale(1.05)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.hit:focus-visible{outline:3px solid #fff;outline-offset:4px}
.btn.small{font-size:15px;padding:11px 22px;animation:none;background:rgba(255,255,255,.14);color:var(--ink);box-shadow:none;border:1px solid rgba(228,205,250,.5)}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(201,162,255,0),0 10px 30px rgba(10,0,30,.5)}100%{box-shadow:0 0 0 0 rgba(201,162,255,0),0 10px 30px rgba(10,0,30,.5)}}
.cake{position:relative;width:280px;height:250px;margin-top:70px}
.plate{position:absolute;left:-12px;right:-12px;bottom:0;height:16px;border-radius:50%;background:linear-gradient(#f3e6ff,#b99be0);box-shadow:0 14px 30px rgba(10,0,30,.55)}
.tier{position:absolute;border-radius:14px 14px 8px 8px;box-shadow:inset 0 -14px 22px rgba(30,0,70,.35)}
.tier::before{content:"";position:absolute;left:0;right:0;top:0;height:30px;border-radius:14px 14px 0 0;
  background:linear-gradient(#fff0ff,#fff0ff) top/100% 16px no-repeat,radial-gradient(circle at 50% 0,#fff0ff 10px,transparent 11px) 0 14px/34px 20px repeat-x}
.tier::after{content:"";position:absolute;inset:36px 8px 10px;opacity:.9;
  background:radial-gradient(circle,#ffd86b 2px,transparent 3px) 0 0/26px 22px,radial-gradient(circle,#ff9ad5 2px,transparent 3px) 13px 11px/26px 22px}
.t1{left:0;bottom:12px;width:280px;height:96px;background:linear-gradient(#8e5fe0,#6d3fb8)}
.t2{left:45px;bottom:108px;width:190px;height:78px;background:linear-gradient(#b58cf5,#8a5bd6)}
.candle{position:absolute;left:50%;bottom:186px;width:12px;height:50px;margin-left:-6px;border-radius:3px;background:repeating-linear-gradient(45deg,#fff 0 6px,#ff9ad5 6px 12px);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.glow{position:absolute;left:50%;bottom:100%;width:200px;height:200px;margin:0 0 -40px -100px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,110,.4),transparent 65%);transition:opacity .4s;pointer-events:none}
.flame{position:absolute;left:50%;bottom:100%;width:16px;height:28px;margin:0 0 3px -8px;border-radius:50%/65% 65% 35% 35%;
  background:radial-gradient(ellipse at 50% 75%,#fff7c2 0,#ffd54a 45%,#ff8a2a 100%);transform-origin:50% 100%;
  animation:flick .18s ease-in-out infinite alternate;box-shadow:0 0 18px 8px rgba(255,190,80,.55);transition:opacity .25s,transform .25s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.08) rotate(3deg)}}
.hit{all:unset;position:absolute;left:50%;bottom:100%;width:76px;height:90px;margin-left:-38px;cursor:pointer;border-radius:14px}
.smoke{position:absolute;left:50%;bottom:100%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:rgba(255,255,255,.7);filter:blur(3px);opacity:0}
.candle.out .flame{opacity:0;transform:scale(0);animation:none}
.candle.out .glow{opacity:0}
.candle.out .smoke{animation:smoke 2.4s ease-out forwards}
@keyframes smoke{0%{opacity:.8;transform:translateY(0) scale(1)}100%{opacity:0;transform:translate(14px,-90px) scale(6)}}
.envelope{position:relative;width:min(320px,78vw);aspect-ratio:3/2;perspective:900px;animation:float 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-1deg)}}
.envelope>*{position:absolute}
.e-back{inset:0;background:var(--env-d);border-radius:10px;box-shadow:0 20px 50px rgba(10,0,30,.6),0 0 60px rgba(185,140,242,.35)}
.e-letter{left:7%;right:7%;top:8%;bottom:8%;background:var(--paper);border-radius:6px;z-index:1;transition:transform .9s .5s cubic-bezier(.3,1.2,.4,1);display:grid;place-items:center;color:var(--text);font:italic 500 20px "Fraunces",serif}
.e-front{inset:0;z-index:2;border-radius:10px;background:linear-gradient(135deg,#9b6ee3,var(--env));clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%)}
.flap{left:0;top:0;width:100%;height:55%;z-index:3;background:var(--flap);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease-in,z-index 0s .35s}
.seal{left:50%;top:44%;width:44px;height:44px;margin:0 0 0 -22px;z-index:4;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9ad5,#c2368f);display:grid;place-items:center;font-size:20px;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:opacity .3s}
.envelope.open .flap{transform:rotateX(180deg);z-index:0}
.envelope.open .seal{opacity:0}
.envelope.open .e-letter{transform:translateY(-48%)}
#letter{position:fixed;inset:0;z-index:4;display:flex;align-items:flex-start;justify-content:center;padding:calc(6vh + env(safe-area-inset-top,0px)) 16px 0;opacity:0;pointer-events:none;transition:opacity .8s}
#letter.show{opacity:1;pointer-events:auto}
.card{width:min(400px,100%);max-height:46vh;overflow-y:auto;background:rgba(255,248,255,.93);color:var(--text);border-radius:18px;padding:20px 22px 16px;box-shadow:0 20px 60px rgba(10,0,30,.6),0 0 0 4px rgba(226,200,255,.35);transform:translateY(60px) scale(.92);transition:transform 1s cubic-bezier(.2,1.2,.4,1)}
#letter.show .card{transform:none}
.card h2{font:600 clamp(20px,5vw,26px)/1.15 "Fraunces",Georgia,serif;margin:0 0 10px;color:#5a2aa5}
.card p{font-size:14.5px;line-height:1.6;margin:0 0 10px;opacity:0;transform:translateY(10px)}
#letter.show .card p,#letter.show .card .sig{animation:rise .8s forwards;animation-delay:calc(1s + var(--i)*.5s)}
@keyframes rise{to{opacity:1;transform:none}}
.sig{font:italic 500 18px "Fraunces",serif;color:#7a3fd0;margin:12px 0 14px;opacity:0}
.card .btn{display:block;margin:0 auto;animation:none;font-size:14px;padding:10px 20px;color:var(--ink);background:linear-gradient(135deg,#7a3fd0,#5a2aa5);box-shadow:0 8px 20px rgba(90,42,165,.4)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>
<div id="garden" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="flash" id="flash"></div>

<main class="scene" id="cakeScene">
  <div>
    <h1 id="wishTitle"></h1>
    <p class="sub" id="hint">Blow into your mic, or tap the flame 🕯️</p>
  </div>
  <div class="cake">
    <div class="plate"></div>
    <div class="tier t1"></div>
    <div class="tier t2"></div>
    <div class="candle" id="candle">
      <div class="glow"></div>
      <div class="flame"></div>
      <div class="smoke"></div>
      <button class="hit" id="flameBtn" aria-label="Blow out the candle"></button>
    </div>
  </div>
  <button class="btn small" id="micBtn">🎤 Blow with microphone</button>
</main>

<main class="scene off" id="envScene">
  <div>
    <h1 id="title"></h1>
    <p class="sub">Your wish came with a letter 💜</p>
  </div>
  <div class="envelope" id="env" aria-hidden="true">
    <div class="e-back"></div>
    <div class="e-letter">for you</div>
    <div class="e-front"></div>
    <div class="flap"></div>
    <div class="seal">💜</div>
  </div>
  <button class="btn" id="openBtn">Open the envelope</button>
</main>

<section id="letter" aria-live="polite">
  <div class="card">
    <h2 id="greet"></h2>
    <div id="msg"></div>
    <div class="sig" id="sig" style="--i:7"></div>
    <button class="btn" id="again">Boom again 🎆</button>
  </div>
</section>

<script>
/* ✏️ EDIT THESE THREE THINGS ✏️ */
const NAME = "Ivaaaan";
const FROM = "your loving bff";
const MESSAGE = [
  "Happy birthday to u, happy birthday to u! happy birthday, happy birthday! HAPPY BIRTHDAY TO YOUUU!!! ",
  "Today is all about you, and honestly, the world got a lot brighter the day you showed up in it.",
  "I wanted to give you something more than a quick text, so I made this little garden just for you. Purple everywhere, because I know it's your color, and flowers, because you make everything around you bloom.",
  "Thank you for being the kind of person who listens, who laughs at the right moments, and who stays when things get messy. Knowing you has made my life softer, funnier, and so much more fun.",
  "I hope this year brings you everything you've been quietly hoping for: big wins, small joys, lazy mornings, and people who love you loudly. You deserve every good thing that comes your way.",
  "Whatever happens, always remember that you are appreciated, you are enough, and you are never walking through anything alone.",
  "Postponed ang plano kasi pareho may sakit, bawi next time! again happy happyy birthday dear 🎂",
  "Luvvvvv uuuuuuu alwaaaaaaaysssss vannieeeeeee!!!💜💜💜"
];

const $=id=>document.getElementById(id);
$('wishTitle').textContent = "Make a wish, " + NAME;
$('title').textContent = "Happy Birthday, " + NAME + "!";
$('greet').textContent = "Dear " + NAME + ",";
$('sig').textContent = "from the bottom of my heart ;>, " + FROM + " 💜";
$('sig').style.setProperty('--i',MESSAGE.length);
MESSAGE.forEach((t,i)=>{const p=document.createElement('p');p.textContent=t;p.style.setProperty('--i',i);$('msg').appendChild(p)});

const c=$('fx'),g=c.getContext('2d');let W,H,ps=[];
function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}
size();addEventListener('resize',size);
const COLS=['#ffd6ff','#e7b8ff','#c58bff','#ff9ad5','#ffe29a','#ffffff','#9b7bff'];
function burst(px,py,n=80){
  const col=COLS[Math.random()*COLS.length|0],col2=COLS[Math.random()*COLS.length|0];
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.2,s=2+Math.random()*5;
    ps.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:i%2?col:col2,r:1.5+Math.random()*2.2})}
}
(function loop(){
  g.globalCompositeOperation='destination-out';g.fillStyle='rgba(0,0,0,.2)';g.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';
  ps=ps.filter(p=>p.l>0);
  for(const p of ps){p.vy+=.05;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.l-=.011;
    g.globalAlpha=Math.max(p.l,0);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.fill()}
  g.globalAlpha=1;requestAnimationFrame(loop)
})();
const rnd=(a,b)=>a+Math.random()*(b-a);
function volley(count,gap){for(let i=0;i<count;i++)setTimeout(()=>burst(rnd(W*.15,W*.85),rnd(H*.08,H*.45),rnd(60,100)),i*gap)}
function boom(){const f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}

const garden=$('garden');
const PET=['#e9b6ff','#ff9ad5','#c58bff','#ffffff','#a98bff','#ffc8ec'];
function flowerSVG(col){
  let p='';for(let a=0;a<360;a+=45)p+=`<ellipse cx="0" cy="-27" rx="12" ry="24" transform="rotate(${a})" fill="${col}" fill-opacity=".92" stroke="rgba(255,255,255,.5)" stroke-width="1"/>`;
  return `<svg viewBox="-55 -55 110 110" width="100%" height="100%">${p}<circle r="13" fill="#ffd86b"/><circle r="6" fill="#ff9a3c"/></svg>`
}
function plant(){
  garden.innerHTML='';
  const n=Math.max(8,Math.round(W/70));
  for(let i=0;i<n;i++){
    const left=(i+.5)/n*100+rnd(-3,3),h=rnd(60,H*.4),s=rnd(48,92),d=rnd(0,1.2);
    const st=document.createElement('div');st.className='stem';
    st.style.cssText=`left:${left}%;--h:${h}px;animation-delay:${d}s`;
    const f=document.createElement('div');f.className='fl';
    f.style.cssText=`left:${left}%;bottom:${h-s/2}px;--s:${s}px;animation-delay:${d+1}s`;
    f.innerHTML=flowerSVG(PET[Math.random()*PET.length|0]);
    garden.append(st,f);
  }
}

let blown=false;
function blowOut(){
  if(blown)return;blown=true;
  $('candle').classList.add('out');
  $('micBtn').style.opacity='0';$('micBtn').style.pointerEvents='none';
  $('hint').textContent="Your wish is on its way ✨";
  setTimeout(()=>{boom();burst(W/2,H*.35,150);volley(6,220);plant()},350);
  setTimeout(()=>volley(5,350),1500);
  setTimeout(()=>{$('cakeScene').classList.add('off');$('envScene').classList.remove('off')},2300);
}
$('flameBtn').addEventListener('click',blowOut);

$('micBtn').addEventListener('click',async()=>{
  const hint=$('hint');
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')await ac.resume();
    const an=ac.createAnalyser();an.fftSize=512;
    ac.createMediaStreamSource(s).connect(an);
    const d=new Uint8Array(an.fftSize);let n=0;
    $('micBtn').textContent="🎤 Listening… blow now!";
    (function tick(){
      if(blown){s.getTracks().forEach(t=>t.stop());ac.close();return}
      an.getByteTimeDomainData(d);
      let sum=0;for(const v of d){const x=(v-128)/128;sum+=x*x}
      const rms=Math.sqrt(sum/d.length);
      n=rms>.12?n+1:Math.max(0,n-1);
      if(n>16)blowOut();
      requestAnimationFrame(tick);
    })();
  }catch(e){hint.textContent="Mic isn't available here, so just tap the flame 🕯️"}
});

$('openBtn').addEventListener('click',e=>{
  e.currentTarget.disabled=true;e.currentTarget.style.opacity='0';
  $('env').classList.add('open');
  setTimeout(()=>{boom();burst(W/2,H*.3,150);volley(6,220)},700);
  setTimeout(()=>volley(6,350),1800);
  setTimeout(()=>{$('envScene').classList.add('off');$('letter').classList.add('show')},2000);
  setTimeout(()=>volley(4,700),4500);
});
$('again').addEventListener('click',()=>{boom();burst(W/2,H*.25,150);volley(8,250)});
</script>
</body>
</html>
